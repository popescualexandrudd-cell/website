[project]
name = "jungle-league-engine"
version = "0.1.0"
description = "Jungle Padel league engine: Weng-Lin rating, levels, ranks, LP, score validation, seasons (pure Python, ADR-0008)"
requires-python = ">=3.12"
dependencies = ["tzdata>=2024.1"]  # Europe/Bucharest on systems without a zoneinfo database

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "openskill>=6.2,<7",  # reference implementation, tests only (§6.2)
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jungle_league"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -p no:cacheprovider"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["jungle_league"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError\\(\"unreachable\"\\)"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
