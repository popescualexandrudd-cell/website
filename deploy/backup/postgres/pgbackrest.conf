# pgBackRest (ADR-0016). The secrets and the off-site repository come from the environment of
# the `db` service (/etc/jungle/backup.env, see deploy/backup/backup.env.example):
#   PGBACKREST_REPO1_CIPHER_PASS                 the key of the copy kept on the server
#   PGBACKREST_REPO2_*                           the off-site copy (S3 in the EU, Q73), when chosen
[global]
# repo1: on the server, in the `pgbackrest` volume (a mistake, a broken database: minutes away)
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
compress-type=zst
start-fast=y
process-max=2
# The transaction log is pushed synchronously: enough for a club, and the asynchronous mode's
# background process makes PostgreSQL in a container restart (seen in the Stage 14B test).
log-level-console=info
log-level-file=off

[jungle]
pg1-path=/var/lib/postgresql/data
# The database's own superuser (POSTGRES_USER in the compose file), over the local socket.
pg1-user=jungle
