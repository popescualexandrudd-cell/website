[project]
name = "jungle-hardware-bridge"
version = "0.1.0"
description = "Jungle Padel Hardware Bridge: local service linking a kiosk's browser to its devices (ADR-0013)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "websockets>=14,<16",
]

[project.scripts]
jungle-bridge = "jungle_bridge.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "anyio>=4.4",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jungle_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -p no:cacheprovider"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["jungle_bridge"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
