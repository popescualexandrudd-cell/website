# Mirror of scripts/test-all on every push (ADR-0021). The project stays verifiable without GitHub.
name: ci
on:
  push:
  pull_request:
jobs:
  test-all:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jungle
          POSTGRES_USER: jungle
          POSTGRES_PASSWORD: jungle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jungle" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://jungle:jungle@localhost:5432/jungle
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: scripts/test-all
