# Mirror of scripts/test-all on every push (ADR-0021). The project stays verifiable without GitHub.
name: ci
on:
  push:
  pull_request:
jobs:
  test-all:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jungle
          POSTGRES_USER: jungle
          POSTGRES_PASSWORD: jungle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jungle" --health-interval 5s --health-retries 10
      # The end-to-end tests use Redis as production does (cache, live updates of the screens).
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://jungle:jungle@localhost:5432/jungle
      E2E_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm --filter @jungle/web exec playwright install --with-deps chromium
      # The hero video test (ADR-0023) encodes a short generated clip with ffmpeg.
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: scripts/test-all
      # An e2e failure keeps its traces and screenshots (Playwright `test-results`) for a week.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/*/test-results/
          retention-days: 7
          if-no-files-found: ignore
