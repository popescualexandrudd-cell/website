# Checks every push and pull request; on main, optionally deploys to the server over SSH.
# To enable deploy: repository variable DEPLOY_ENABLED=true and secrets DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY, DEPLOY_PATH (see DEPLOY.md, "Actualizare automată din GitHub").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://tenis:tenis@localhost:5432/tenis
  APP_URL: http://localhost:3100
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  EMAIL_FROM: "CI <ci@example.com>"
  COACH_NOTIFY_EMAIL: antrenor@example.com
  MEDIA_DIR: ./storage/media
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, tipuri, teste, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenis
          POSTGRES_PASSWORD: tenis
          POSTGRES_DB: tenis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenis -d tenis"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Diacritice cu virgulă (fără s și t cu sedilă)
        # Byte patterns (UTF-8) for the cedilla letters U+015E, U+015F, U+0162, U+0163, so this
        # file itself does not contain them. Text files only (-I): images and video posters
        # contain such bytes by chance.
        run: |
          if LC_ALL=C grep -rnIE $'\xc5\x9e|\xc5\x9f|\xc5\xa2|\xc5\xa3' --exclude-dir=node_modules --exclude-dir=.git --exclude="PROMPT*.md" .; then
            echo "Am găsit diacritice cu sedilă. Folosește ș ț Ș Ț (virgulă dedesubt)."; exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck

      - name: Teste unitare și de integrare (PostgreSQL real)
        run: npm test

      - name: Imagini, build, unelte
        run: |
          npm run images
          npm run build
          npm run build:tools

      - name: Baza de date pentru testele end-to-end
        run: |
          npx prisma migrate deploy
          node dist/seed.mjs --if-empty
          node dist/admin-create.mjs --email antrenor@example.com --name "Antrenor Test" --password "parola-test-2026!" --role PROPRIETAR

      - name: Browser pentru Playwright
        run: npx playwright install --with-deps chromium

      - name: Teste end-to-end (+ axe)
        run: npm run test:e2e

      - name: Audit dependențe (fără vulnerabilități critice)
        run: npm audit --audit-level=critical

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Imaginea Docker
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construiește imaginea de producție
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: antrenor-tenis-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy pe server
    runs-on: ubuntu-24.04
    needs: [check, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    timeout-minutes: 30
    environment: production
    steps:
      - name: Actualizare prin SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            ./scripts/deploy.sh
