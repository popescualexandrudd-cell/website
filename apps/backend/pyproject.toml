[project]
name = "jungle-backend"
version = "0.1.0"
description = "Jungle Padel central backend (Django + Django Ninja)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "phonenumbers>=8.13",
    "redis>=5.0",
    "gunicorn>=23",
    "segno>=1.6.6",
    "reportlab>=5.0.1",
    "httpx[http2]>=0.28.1",
    "jungle-league-engine",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "time-machine>=2.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1",
    "types-reportlab>=5.0.0.20260911",
]

[tool.uv]
package = false

[tool.uv.sources]
jungle-league-engine = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "jungle.settings_test"
python_files = ["test_*.py"]
testpaths = ["jungle"]
addopts = "--strict-markers --reuse-db -p no:cacheprovider"
filterwarnings = ["error", "ignore::DeprecationWarning:pkg_resources.*"]

[tool.coverage.run]
branch = true
source = ["jungle"]
omit = ["*/migrations/*", "*/tests/*", "jungle/asgi.py", "jungle/wsgi.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["*.tests.*", "*.migrations.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["dj_database_url", "phonenumbers.*", "pyotp.*", "corsheaders.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "jungle.settings"
