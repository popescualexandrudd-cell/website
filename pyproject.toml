# uv workspace root (virtual: no package of its own). See ADR-0002.
[tool.uv.workspace]
members = ["apps/backend", "packages/league-engine", "services/hardware-bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "RUF", "PT", "C4", "DTZ"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Romanian diacritics and typographic quotes are intentional
    "RUF012",  # Django `class Meta` attributes (ordering, constraints) are idiomatic lists
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "PT018", "RUF043"]
"packages/league-engine/tools/**" = ["S311", "E501"]  # seeded RNG; long SVG/Markdown template lines
"**/conftest.py" = ["S101", "S105", "S106", "S107"]
"**/core/errors.py" = ["S105"]  # error-code names such as ACCOUNTS_PASSWORD_WEAK are not secrets
"**/management/commands/**" = ["S311"]
