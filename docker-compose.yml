# Production stack. Start / update:  docker compose up -d --build   (see DEPLOY.md)
# Services: app (Next.js), worker (emails, reminders, retention), db (PostgreSQL 16, not exposed),
# caddy (HTTPS), backup (nightly, 14 days). Optional: umami (--profile analytics).
name: antrenor-tenis

x-app: &app
  build: .
  image: antrenor-tenis-app:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    MEDIA_DIR: /app/storage/media
    TRUST_PROXY: "true"
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
    - /app/.next/cache
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  volumes:
    - media:/app/storage/media
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, web]

  worker:
    <<: *app
    command: ["node", "dist/worker.mjs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_DIR: /app/storage/media
      RUN_MIGRATIONS: "0"
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    networks: [backend, web]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      UMAMI_DOMAIN: ${UMAMI_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/sites:/etc/caddy/sites:ro
      - media:/srv/media:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
    networks: [web]

  backup:
    build: ./docker/backup
    image: antrenor-tenis-backup:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      TZ: ${TZ:-Europe/Bucharest}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - backups:/backups
      - media:/media
      - ./docker/backup/rclone:/config/rclone:ro
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [backend, web]

  # Optional cookieless analytics:  docker compose --profile analytics up -d
  umami:
    profiles: [analytics]
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    logging: *logging
    networks: [web, analytics]

  umami-db:
    profiles: [analytics]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [analytics]

networks:
  # The database network has no route to the internet and no published ports.
  backend:
    internal: true
  web: {}
  analytics:
    internal: true

volumes:
  db-data:
  media:
  backups:
  caddy-data:
  caddy-config:
  umami-db-data:
