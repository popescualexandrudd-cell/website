# Configurația clubului: un singur fișier pentru tot site-ul.
# Pentru un club nou: completezi valorile de mai jos, rulezi `npm run db:reset` (reconstruiește
# baza de date din acest fișier), apoi încarci logoul, fotografiile și video-urile din admin.
# După primul seed, totul se editează din admin; fișierul nu mai e citit.
# Orice valoare care rămâne între paranteze pătrate apare pe site ca [DE COMPLETAT].
# Valorile marcate „opțional" sau „url sau gol" rămân simplu goale dacă nu le completezi.
# Ghidul complet: SABLON.md.

club:
  nume: "Clubul Tenis Elite"
  # Două-trei litere, afișate cât timp nu e încărcat un logo (admin → Setări → Logo).
  monograma: "CTE"
  # Apare sub nume, în antet, și în titlul paginilor.
  descriere:
    ro: "Club de tenis · Pantelimon"
    en: "Tennis club · Pantelimon"
  # Culorile clubului, în formatul #rrggbb: baza închisă a designului și accentul (butoane,
  # linkuri). Se schimbă oricând din admin → Setări; accentul trebuie să rămână lizibil cu text alb.
  # Verdele din logoul clubului: verde de pădure pentru bază, verde de frunză pentru accent.
  culori:
    principala: "#16351b"
    accent: "#3a7a1e"
  # Anul în care s-a deschis clubul: patru terenuri de zgură în aer liber în 2013, apoi sala
  # acoperită cu încă patru.
  infiintat: 2013

