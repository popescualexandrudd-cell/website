# Academia de juniori: grupele, pe vârste și pe etapele ITF „Play and Stay" (minge roșie,
# portocalie, verde, apoi minge galbenă pe terenul mare). Confirmă vârstele și completează
# zilele, orele, taxa lunară și numărul de locuri; o grupă ștearsă de aici nu apare pe site.
academie_juniori:
  grupe:
    - {
        etapa: "roșu",
        varsta: "4-7",
        program: "Inițiere",
        sedinte_pe_saptamana: "[ ]",
        durata_min: 60,
        zile_ore: "[ex. luni și miercuri, 17:00–18:00]",
        taxa_lunara_ron: "[ ]",
        locuri: "[ ]",
      }
    - {
        etapa: "portocaliu",
        varsta: "8-9",
        program: "Inițiere",
        sedinte_pe_saptamana: "[ ]",
        durata_min: 90,
        zile_ore: "[ex. marți și joi, 17:00–18:30]",
        taxa_lunara_ron: "[ ]",
        locuri: "[ ]",
      }
    - {
        etapa: "verde",
        varsta: "9-11",
        program: "Competiție",
        sedinte_pe_saptamana: "[ ]",
        durata_min: 90,
        zile_ore: "[ ]",
        taxa_lunara_ron: "[ ]",
        locuri: "[ ]",
      }
    - {
        etapa: "galben",
        varsta: "11-18",
        program: "Competiție",
        sedinte_pe_saptamana: "[ ]",
        durata_min: 120,
        zile_ore: "[ ]",
        taxa_lunara_ron: "[ ]",
        locuri: "[ ]",
      }

# Tipurile de lecții care se rezervă online. Tariful e pe oră; prețul unei lecții se calculează
# din durata aleasă la rezervare (90 de minute = 1,5 × tariful). tarif_pe: "lecție" sau "persoană".
lectii:
  - {
      nume: "Lecție individuală",
      persoane: "1",
      durate_min: [60, 90, 120, 150, 180],
      tarif_ora_ron: "[ ]",
      tarif_pe: "lecție",
    }
  - {
      nume: "Lecție în doi",
      persoane: "2",
      durate_min: [60, 90, 120, 150, 180],
      tarif_ora_ron: "[ ]",
      tarif_pe: "persoană",
    }
  - {
      nume: "Lecție în trei",
      persoane: "3",
      durate_min: [60, 90, 120, 150, 180],
      tarif_ora_ron: "[ ]",
      tarif_pe: "persoană",
    }
  - {
      nume: "Lecție de grup",
      persoane: "4-6",
      durate_min: [60, 90, 120, 150, 180],
      tarif_ora_ron: "[ ]",
      tarif_pe: "persoană",
    }
  - {
      nume: "Analiză biomecanică",
      persoane: "1",
      durate_min: [60, 90, 120],
      tarif_ora_ron: "[ ]",
      tarif_pe: "lecție",
    }

pachete:
  - { nume: "[ex. 5 lecții individuale]", pret_ron: "[ ]", valabilitate_zile: 60 }
  - { nume: "[ex. 10 lecții individuale]", pret_ron: "[ ]", valabilitate_zile: 120 }

servicii_incluse: # ce primesc elevii academiei, pe lângă teren
  - "Evaluare inițială și plan de antrenament personalizat"
  - "Rachete și mingi de împrumut pentru începători"
  - "Mașină de aruncat mingi"
  - "Analiză video a loviturilor, trimisă după lecție"
  - "[Racordare rachete, dacă e cazul]"
  - "[Pregătire și însoțire la turnee, dacă e cazul]"

# Orele în care academia primește rezervări de lecții (clubul e deschis zilnic 08–23).
program_lucru:
  luni_vineri: "08:00–21:00"
  sambata: "08:00–14:00"
  duminica: "închis"

rezervari:
  mod: "cerere" # "cerere" = fiecare rezervare e confirmată din admin | "instant"
  anulare_gratuita_ore: 24
  rezervare_minim_ore_inainte: 12
  orizont_zile: 60
  pauza_intre_lectii_min: 10
  prima_lectie: "[ex. evaluare de 30 de minute, gratuită / la preț redus]"

plata:
  metode: ["numerar la teren", "transfer bancar"]
  plata_online_stripe: false # true = activează modulul Stripe

site:
