# Configurația clubului: un singur fișier pentru tot site-ul.
# Pentru un club nou: completezi valorile de mai jos, rulezi `npm run db:reset` (reconstruiește
# baza de date din acest fișier), apoi încarci logoul, fotografiile și video-urile din admin.
# După primul seed, totul se editează din admin; fișierul nu mai e citit.
# Orice valoare care rămâne între paranteze pătrate apare pe site ca [DE COMPLETAT].
# Valorile marcate „opțional" sau „url sau gol" rămân simplu goale dacă nu le completezi.
# Ghidul complet: SABLON.md.

club:
  nume: "Elite Tennis Club"
  # Două-trei litere, afișate cât timp nu e încărcat un logo (admin → Setări → Logo).
  monograma: "ETC"
  # Apare sub nume, în antet, și în titlul paginilor.
  descriere:
    ro: "Academie de tenis"
    en: "Tennis academy"
  # Culorile clubului, în formatul #rrggbb: baza închisă a designului și accentul (butoane,
  # linkuri). Se schimbă oricând din admin → Setări; accentul trebuie să rămână lizibil cu text alb.
  culori:
    principala: "#0f3b2f"
    accent: "#c24f1d"

# Echipa de antrenori. Primul din listă e antrenorul principal. Pentru fiecare antrenor nou:
# nume, rol, titulatura, rezumat și parcurs; restul e opțional. Fotografiile se încarcă din admin.
antrenori:
  - nume: "Popescu Alexandru Daniel"
    rol:
      ro: "Antrenor principal"
      en: "Head coach"
    # Una-două propoziții pentru cardul din echipă.
    rezumat:
      ro: "Licențiat UNEFS, specializarea tenis, și arbitru național FRT. Lucrează cu copii, juniori și adulți, de la inițiere la turnee."
      en: "UNEFS graduate in tennis and a national FRT umpire. Works with children, juniors and adults, from first lessons to tournaments."
    specializari:
      - { ro: "inițiere pentru copii și adulți", en: "beginners, children and adults" }
      - { ro: "pregătire pentru competiție", en: "competition preparation" }
      - { ro: "analiză biomecanică a loviturilor", en: "biomechanical stroke analysis" }
    titulatura:
      ro: "Antrenor de tenis"
      en: "Tennis coach"
    ani_experienta: 4
    # Fiecare certificare: titlul (ro/en), emitentul și, opțional, anul.
    certificari:
      - titlu:
          ro: "Licență în performanță sportivă, specializarea tenis și performanță motrică"
          en: "Bachelor's degree in sports performance, specialising in tennis and motor performance"
        emitent: "Universitatea Națională de Educație Fizică și Sport (UNEFS)"
        an: "[anul absolvirii]"
      - titlu:
          ro: "Master în management și marketing în structuri sportive (în curs)"
          en: "Master's in management and marketing of sports organisations (in progress)"
        emitent: "Universitatea Națională de Educație Fizică și Sport (UNEFS)"
        an: ""
      - titlu:
          ro: "Arbitru național de tenis"
          en: "National tennis umpire"
        emitent: "Federația Română de Tenis"
        an: "[anul certificării]"
      - titlu:
          ro: "Program de formare psihopedagogică, cu atestat pentru activitatea didactică"
          en: "Teacher training programme in psychology and pedagogy, certified to teach"
        emitent: "[instituția care a eliberat atestatul]"
        an: "[anul absolvirii]"
    limbi_vorbite: ["română", "engleză"]
    parcurs:
      ro: |-
        Am început tenisul ca sportiv, într-un liceu cu program sportiv. Am mers apoi la Universitatea Națională de Educație Fizică și Sport din București, unde am terminat licența în performanță sportivă, cu specializarea tenis. Acum urmez masterul de management și marketing în structuri sportive, tot la UNEFS.

        Sunt arbitru național de tenis, certificat de Federația Română de Tenis. Faptul că știu regulamentul și cum decurge un turneu din interior mă ajută mult când pregătesc copiii pentru competiții. Am făcut și formarea psihopedagogică, așa că îmi pregătesc fiecare lecție cu un obiectiv clar și cresc efortul treptat, în ritmul fiecăruia.

        Antrenez de patru ani. La Elite Tennis Club, în Pantelimon, lucrez cu copii și adulți de toate nivelurile, de la primii pași până la juniorii care joacă turnee.
      en: |-
        I started tennis as an athlete, at a sports high school. I then went to the National University of Physical Education and Sport in Bucharest, where I earned a bachelor's degree in sports performance, specialising in tennis. I am now doing a master's in management and marketing of sports organisations, also at UNEFS.

        I am a national tennis umpire certified by the Romanian Tennis Federation. Knowing the rules and how a tournament runs from the inside helps a lot when I prepare children for competitions. I have also completed teacher training, so I plan every lesson around one clear goal and build up the effort gradually, at each player's pace.

        I have been coaching for four years. At Elite Tennis Club in Pantelimon I work with children and adults of every level, from first steps to juniors who play tournaments.
    rezultate_elevi:
      ro: "Câțiva dintre copiii pe care i-am pregătit au avut rezultate bune la nivel național și european, inclusiv titluri de campion al României."
      en: "Several of the children I have coached have done well nationally and in Europe, including Romanian champions."

