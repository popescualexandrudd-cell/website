# Când e deschis clubul (închirierea terenurilor): apare pe site, în subsol și la contact.
program_club:
  zilnic: "07:00–22:00"

# Închirierea terenurilor: tarifele pe oră, în Markdown (tabele, titluri, liste).
inchiriere:
  tarife: |-
    ### Campania de iarnă: 60 de lei pe oră

    Pe toată durata sezonului de iarnă, orice teren de zgură se închiriază cu **60 de lei pe oră**, zilnic, între 07:00 și 22:00.

    ### Tarife de vară (de la 1 mai)

    | Tarif pe oră | 07:00–17:00 | 17:00–22:00 |
    | --- | --- | --- |
    | Teren afară, luni–vineri | 40 lei | 80 lei |
    | Teren în sală, luni–vineri | 50 lei | 80 lei |
    | Weekend, tarif unic | 50 lei | 80 lei |

    **Joacă mereu cu mingi noi.** Închiriezi în weekend cel puțin 2 ore de teren și primești cadou o cutie de 4 mingi Dunlop ATP Championship. Oferta este valabilă doar pentru rezervările făcute direct la club.
  tarife_en: |-
    ### Winter campaign: 60 lei an hour

    Throughout the winter season, any clay court can be hired for **60 lei an hour**, every day between 07:00 and 22:00.

    ### Summer rates (from 1 May)

    | Rate per hour | 07:00–17:00 | 17:00–22:00 |
    | --- | --- | --- |
    | Outdoor court, Monday–Friday | 40 lei | 80 lei |
    | Indoor court, Monday–Friday | 50 lei | 80 lei |
    | Weekend, single rate | 50 lei | 80 lei |

    **Always play with new balls.** Book a court for at least 2 hours at the weekend and get a can of 4 Dunlop ATP Championship balls as a gift. Only for bookings made directly with the club.

