  - { nume: "Antrenament individual", persoane: "1", durate_min: [60, 90, 120], tarif_pe: "lecție" }
  - { nume: "Antrenament în 2", persoane: "2", durate_min: [60, 90, 120], tarif_pe: "persoană" }
  - { nume: "Antrenament în 3", persoane: "3", durate_min: [60, 90, 120], tarif_pe: "persoană" }
  - { nume: "Antrenament de grup", persoane: "4-6", durate_min: [60, 90, 120], tarif_pe: "persoană" }

