# Grupele clubului, pe etapele ITF „Play and Stay”: minitenis cu mingea roșie, portocalie și
# verde, apoi juniori și seniori cu mingea galbenă, de la 11 ani. Zilele, orele, taxa lunară și
# locurile se completează din admin → Grupe; câmpurile goale nu apar pe site.
academie_juniori:
  grupe:
    - { etapa: "roșu", varsta: "4-7", program: "Inițiere", durata_min: 60 }
    - { etapa: "portocaliu", varsta: "8-9", program: "Inițiere", durata_min: 60 }
    - { etapa: "verde", varsta: "9-11", program: "Competiție", durata_min: 90 }
    - { etapa: "galben", varsta: "11+", program: "Competiție", durata_min: 90 }

